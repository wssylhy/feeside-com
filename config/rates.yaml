# =============================================================================
# config/rates.yaml — P1 single source of truth for ALL fee numbers
# (CHARTER v2.1 §3.1: pages and articles must never hardcode rates)
#
# RULES:
#   - Every numeric field stays null until the rates-scan workflow
#     (GitHub Actions, US runner) collects it from the official page
#     AND a human [核] cross-check confirms it.
#   - NEVER fill any number from model memory. (待 Actions 采集)
#   - verified becomes true ONLY after the human cross-check passes.
# =============================================================================

